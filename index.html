<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EnrollmentNow Notifications</title><style>body{margin:0;background:#f5f8fc;color:#172b4d;font:15px Arial}header{padding:18px 7%;background:#fff;border-bottom:1px solid #d9e2ec;font-size:20px;font-weight:bold;color:#0b3568}.logo{background:#1267c5;color:#fff;border-radius:6px;padding:7px 10px;margin-right:9px}main{max-width:900px;margin:auto;padding:36px 20px}h1{margin-bottom:5px;color:#0b3568}p{color:#5e6c84}.card,.demo{margin-top:24px;background:#fff;border:1px solid #d9e2ec;border-radius:9px}.bar{padding:16px 20px;border-bottom:1px solid #d9e2ec;font-weight:bold}.item{display:flex;gap:13px;padding:16px 20px;border-bottom:1px solid #e9eef4;cursor:pointer}.item:hover{background:#f5f9ff}.new{background:#f3f8ff}.ico{width:36px;height:36px;border-radius:50%;text-align:center;line-height:36px;font-weight:bold;background:#e8f7ef;color:#147d49}.bad{background:#fff0ef;color:#b42318}.wait{background:#f1edff;color:#6246a8}.drop{background:#e9f3ff;color:#1267c5}.fail{background:#fff6db;color:#9a6700}.txt{flex:1}.title{font-weight:bold;margin-bottom:5px}.small{font-size:12px;color:#5e6c84;margin-top:7px}.status{font-size:12px;background:#eef2f7;height:min-content;padding:5px;border-radius:10px}.demo{padding:18px}.demo h2{font-size:16px;margin:0 0 8px}button{padding:8px;margin:2px;color:#124b85;background:#fff;border:1px solid #b9c8d8;border-radius:5px;cursor:pointer}.empty{text-align:center;padding:45px}.modal{display:none;position:fixed;inset:0;background:#091e425c}.box{background:#fff;max-width:460px;margin:15vh auto;padding:24px;border-radius:9px}.detail{padding:12px;background:#f6f8fa;line-height:1.7}#close{float:right;border:0;font-size:20px}@media(max-width:500px){main{padding:22px 10px}.status{display:none}}</style></head><body><header><span class="logo">E</span>EnrollmentNow</header><main><div class="small">Home / Notifications · Test User</div><h1>Registration Notifications</h1><p>Review updates about your course registration activity.</p><section class="card"><div class="bar">Recent notifications <span id="count" style="float:right;color:#1267c5"></span></div><div id="list"></div></section><section class="demo"><h2>Prototype controls</h2><p>Sample data for ENR-55 design prototype.</p><button onclick="draw()">Show all notifications</button><button onclick="draw([])">Show empty state</button><button onclick="readAll()">Mark all as read</button><button onclick="reset()">Reset demo</button><p class="small">Delivery failures are recorded separately and do not change registration status.</p></section></main><div class="modal" id="m"><div class="box"><button id="close" onclick="m.style.display='none'">×</button><div id="detail"></div></div></div><script>let a=[['✓','Registration confirmed','You are registered for MCS-4513 Software Quality and Project Management.','MCS-4513 · Software Quality and Project Management','Registration completed','Delivered','',0],['!','Registration request not completed','Your request for MAT-2010 Calculus II was rejected because it conflicts with MCS-4513.','MAT-2010 · Calculus II','Registration rejected — schedule conflict','Delivered','bad',0],['★','A waitlist seat is available','A seat is now available in CSC-2300 Data Structures.','CSC-2300 · Data Structures','Waitlist seat available','Delivered','wait',0],['−','Course removal confirmed','You have been removed from PHY-2010 General Physics I.','PHY-2010 · General Physics I','Course removed','Delivered','drop',1],['⚠','Notification delivery issue recorded','A confirmation notification for ENG-2000 could not be delivered. Your registration remains confirmed.','ENG-2000 · Technical Communication','Registration completed; delivery attempt failed','Delivery failure recorded','fail',1]];function draw(x=a){count.textContent=a.filter(n=>!n[7]).length+' unread';list.innerHTML=x.length?x.map((n,i)=>`<div class="item ${n[7]?'':'new'}" onclick="openN(${i})"><div class="ico ${n[6]}">${n[0]}</div><div class="txt"><div class="title">${n[1]}</div><div>${n[2]}</div><div class="small">${n[3]} · October 10, 2026</div></div><div class="status">${n[5]}</div></div>`).join(''):'<div class="empty">🔔<h3>No registration notifications are available.</h3><p>When your registration status changes, updates will appear here.</p></div>'}function openN(i){let n=a[i];n[7]=1;draw();detail.innerHTML=`<h2>${n[1]}</h2><p>${n[2]}</p><div class="detail"><b>Course:</b> ${n[3]}<br><b>Action:</b> ${n[4]}<br><b>Status:</b> ${n[5]}<br><b>Read status:</b> Read</div><p>${n[6]=='fail'?'Failure was recorded; registration data was not changed.':'This notification has been marked as read.'}</p>`;m.style.display='block'}function readAll(){a.forEach(n=>n[7]=1);draw()}function reset(){a.forEach((n,i)=>n[7]=i>2);draw()}draw()</script></body></html>
